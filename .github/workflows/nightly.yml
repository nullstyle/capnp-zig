name: Nightly

on:
  schedule:
    # 09:17 UTC daily — off the top-of-hour rush.
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  soak:
    name: RPC soak (chaos + deadlines, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.813+2153f8143

      - name: Run soak harness (2 minutes, 8 workers)
        run: zig build soak -- --seconds 120 --workers 8

      - name: Run soak harness under ReleaseSafe (1 minute)
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds 60 --workers 8

  fuzz:
    name: Coverage-guided fuzzing (10 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.813+2153f8143

      - name: Fuzz untrusted-input surfaces
        # timeout rc 124 = ran the full window without finding a crash.
        #
        # Zig master's coverage-guided fuzzer is experimental and its own
        # infrastructure can crash (build-runner tmp/ cleanup races with
        # the fuzzer's log file, maker slice panics). Those are not
        # findings: a real finding is the fuzz TARGET dying, reported by a
        # normally exiting build runner. Classify maker crashes and
        # fuzzer-runtime panics as warnings so the job fails only on
        # genuine findings.
        run: |
          set +e
          timeout --kill-after=30 600 zig build test-fuzz --fuzz 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 124 ]; then
            echo "fuzzing window elapsed with no findings"
            exit 0
          fi
          # Downgrade ONLY zig fuzzer infrastructure failures (maker slice
          # panics, libfuzzer harness errors) to warnings. Do NOT match the
          # bare token `fuzzer.zig`: a genuine finding — the fuzz TARGET dying —
          # prints a stack trace that also passes through `fuzzer.zig`, so
          # matching it here silently swallowed real memory-safety findings.
          # If a true infra panic ever fails to match these specific markers,
          # the nightly (non-blocking) goes red for triage — the safe direction.
          if grep -qE "the following maker command terminated with signal|libfuzzer\.log" fuzz.log; then
            echo "::warning::zig fuzzer infrastructure failed (experimental on zig master) — not a fuzz finding"
            exit 0
          fi
          echo "fuzzer exited early (rc=$rc) — likely a finding"
          exit "$rc"

  extended-gates:
    name: Extended gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.813+2153f8143

      # setup-zig's built-in cache saves a fresh per-job entry every run, so
      # CI churn evicts it from the repo's 10 GB quota long before the next
      # nightly. Keep the package store in its own small entry keyed on the
      # dependency manifest — shared with ci.yml's quic-transport lane, so
      # every push to main re-warms it.
      - name: Restore Zig package cache
        uses: actions/cache@v4
        with:
          path: .zig-cache/p
          key: zig-packages-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      - name: Prefetch dependency tree
        # Retries transient upstream failures (boringssl.googlesource.com
        # 503s took down the 2026-07-03 nightly) so the QUIC gate below
        # only ever fails on real regressions.
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::dependency fetch attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "dependency fetch failed after 3 attempts"
          exit 1

      - name: Full test suite
        run: zig build test --summary all

      - name: ReleaseSafe hardening tests
        run: zig build test-release-safe --summary all

      - name: QUIC transport tests
        run: zig build -Dquic=true test-rpc-quic --summary all
