name: Nightly

on:
  schedule:
    # 09:17 UTC daily — off the top-of-hour rush.
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  soak:
    name: RPC soak (chaos + deadlines, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Run soak harness (2 minutes, 8 workers)
        run: zig build soak -- --seconds 120 --workers 8

      - name: Run soak harness under ReleaseSafe (1 minute)
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds 60 --workers 8

      # 64 workers, not 8: the accept-churn abort class (setTcpNoDelay
      # dying through std.posix.setsockopt's `unreachable` errno arms when
      # a peer resets the socket between accept() and the option call,
      # fixed in 8386468) reproduced 6/6 locally at >=32 workers and never
      # at 8 — worker count is the trigger, so the low-count lanes above
      # cannot see this class. ReleaseSafe: locally the abort surfaced
      # only under optimized timing (0/2 in Debug at the same load).
      #
      # Windows runs 20s, not 60s. This lane's FIRST run (33029339794)
      # caught the parked-accept teardown panic, fixed in WorkerPool
      # (stopAccepting orders nudge-unpark before close). The residual:
      # a 60s run at 64 workers burns ~20k client ports while Windows
      # holds each in TIME_WAIT for 120s against a ~16k dynamic range
      # (measured: 16,224 TIME_WAIT after one 60s run) — once the host
      # is port-exhausted, no self-connect nudge can land, the close
      # valve fires under parked accepts, and std's netAcceptWindows
      # treats the resulting STATUS_CANCELLED as unreachable (a std
      # defect worth an upstream report). 20s keeps teardown well under
      # the ceiling; the lane's purpose — the >=32-worker regime — is
      # unchanged. Repro evidence: branch lane ci/win-accept-teardown,
      # runs 33031327060 (red, pre-fix) / 33032117486 (20s green x2 +
      # 60s diagnostic red with the port census).
      - name: Run soak harness under ReleaseSafe (64 workers)
        shell: bash
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds ${{ runner.os == 'Windows' && '20' || '60' }} --workers 64

      # Linux-only: libtsan segfaults at startup on darwin at the pinned Zig,
      # and Windows has no zig TSan runtime; build.zig hard-fails the step on
      # unsupported hosts rather than passing vacuously. 30 seconds is enough
      # for the worker/connection churn to cross-schedule under TSan's ~5-15x
      # slowdown.
      - name: Run soak harness under ThreadSanitizer (30 seconds)
        if: runner.os == 'Linux'
        run: zig build soak-tsan -- --seconds 30 --workers 8

  # Forward-compat: build and test against a NEWER zig dev snapshot than
  # mise.toml pins, so std API drift is caught at our gate instead of in a
  # downstream that tracks master more closely (SLCP hit exactly that: the
  # `netWrite`/`netRead` vtable entries moved to `Operation.net_write` /
  # `.net_read`, and every consumer of our TCP transport stopped compiling).
  #
  # The probe version is PINNED, not "latest": a moving target turns this
  # lane into a random-failure generator. Bump it deliberately, and treat a
  # red run as "port the shim, then bump" — the transport selects on the
  # OPERATION's presence, so both sides of a move keep building.
  #
  # Linux only: std's macOS libdispatch backend does not compile at
  # dev.1786 (`Io/Dispatch.zig` switches non-exhaustively over the widened
  # Operation union), which is a std bug, not ours, and would make this
  # lane red for a reason we cannot fix here.
  forward-compat:
    name: Forward-compat (zig dev.1786)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - name: Install the probe toolchain
        run: mise install zig@0.17.0-dev.1786+75044cb04

      - name: Build against the probe toolchain
        run: mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build check --summary all

      - name: Transport + wire suites against the probe toolchain
        run: |
          mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build test-rpc-transport --summary all
          mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build test-rpc-wire --summary all

  fuzz:
    name: Coverage-guided fuzzing (10 minutes)
    # arm64, not ubuntu-latest: on x86_64 the zig fuzzer's maker dies with
    # "start index 1 is larger than end index 0" right after the fuzz phase
    # starts, before any coverage-guided signal — reproduced on CI with both
    # dev.813 (run 30533131144) and dev.1252 (run 30562797754), i.e. on both
    # sides of the dev.1190 maker restructure. The same snapshot + command on
    # aarch64-linux fuzzes a full 10-minute window cleanly (probed 2026-07-30,
    # native ubuntu-24.04 container: 626s, zero infra panics, growing corpus).
    # arm runners are free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      # This lane used to pin its own Zig (dev.1252) because the repo's
      # standard toolchain was dev.813, whose fuzzer maker panics, while
      # dev.1444+ renamed std.builtin.OptimizeMode and would not compile this
      # tree. Both halves are resolved: the tree was migrated to the new
      # Optimize spelling and the whole repo now pins one version in mise.toml,
      # so this lane takes the same toolchain as everything else. If the
      # fuzzer regresses again, re-probe (600s+, cold cache, grep the log for
      # panics — not just the exit code) before reintroducing a divergent pin.
      - uses: ./.github/actions/setup-zig

      - name: Fuzz untrusted-input surfaces
        # timeout rc 124 = ran the full window without finding a crash.
        #
        # Zig master's coverage-guided fuzzer is experimental and its own
        # infrastructure can crash (build-runner tmp/ cleanup races with
        # the fuzzer's log file, maker slice panics). Those are not
        # findings: a real finding is the fuzz TARGET dying, reported by a
        # normally exiting build runner. Classify maker crashes and
        # fuzzer-runtime panics as warnings so the job fails only on
        # genuine findings.
        run: |
          set +e
          # A run that produced NO fuzzing must not be reportable as success.
          # This job passed green for 30 consecutive nightlies while the zig
          # fuzzer's `maker` aborted at startup: the infra-failure downgrade
          # below fired every time, so "the fuzzer never started" was
          # indistinguishable from "the window elapsed with no findings". The
          # elapsed-time floor is that missing positive signal.
          FUZZ_WINDOW=600
          MIN_FUZZ_SECONDS=120
          started=$(date +%s)
          # -j1 caps the fuzzer at a single instance. With N instances the
          # dev.1252 fuzzer's workers race creating the shared coverage file
          # in .zig-cache/v/ and a loser can ABRT at init ("failed to open
          # coverage file ...: FileNotFound"). One instance still fuzzes every
          # fuzz test round-robin, so no target loses coverage.
          timeout --kill-after=30 "$FUZZ_WINDOW" zig build test-fuzz --fuzz -j1 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          elapsed=$(( $(date +%s) - started ))
          echo "fuzzing ran for ${elapsed}s (rc=${rc})"

          if [ "$rc" -eq 124 ]; then
            echo "fuzzing window elapsed with no findings"
            exit 0
          fi

          # Downgrade ONLY zig fuzzer infrastructure failures (maker slice
          # panics, libfuzzer harness errors) to warnings. Do NOT match the
          # bare token `fuzzer.zig`: a genuine finding — the fuzz TARGET dying —
          # prints a stack trace that also passes through `fuzzer.zig`, so
          # matching it here silently swallowed real memory-safety findings.
          # If a true infra panic ever fails to match these specific markers,
          # the nightly (non-blocking) goes red for triage — the safe direction.
          if grep -qE "the following maker command terminated with signal|libfuzzer\.log" fuzz.log; then
            if [ "$elapsed" -lt "$MIN_FUZZ_SECONDS" ]; then
              echo "::error::The zig fuzzer aborted after ${elapsed}s, before fuzzing began — this run produced ZERO coverage-guided signal. Not a fuzz finding, and not a pass either. Remediation: pin the fuzz lane to a zig snapshot whose fuzzer works, or vendor one. Until then this job is red by design; SECURITY.md must not claim coverage-guided fuzzing as an active control."
              exit 1
            fi
            echo "::warning::zig fuzzer infrastructure failed after ${elapsed}s of real fuzzing (experimental on zig master) — not a fuzz finding"
            exit 0
          fi

          echo "fuzzer exited early (rc=$rc) — likely a finding"
          exit "$rc"

  extended-gates:
    name: Extended gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # The full suite hard-requires the capnp CLI since 380e12e
      # (schema_fidelity_test runs it with missing=.required). Every ci.yml
      # job that runs the suite installs it; this job broke every Nightly
      # from 2026-08-12 to 2026-08-20 by omitting it.
      - uses: ./.github/actions/setup-capnp

      # setup-zig's built-in cache saves a fresh per-job entry every run, so
      # CI churn evicts it from the repo's 10 GB quota long before the next
      # nightly. Keep the package store in its own small entry keyed on the
      # dependency manifest — shared with ci.yml's quic-transport lane, so
      # every push to main re-warms it.
      - name: Restore Zig package cache
        uses: actions/cache@v5
        with:
          path: .zig-cache/p
          key: zig-packages-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      - name: Prefetch dependency tree
        # Retries transient upstream failures (boringssl.googlesource.com
        # 503s took down the 2026-07-03 nightly) so the QUIC gate below
        # only ever fails on real regressions.
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::dependency fetch attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "dependency fetch failed after 3 attempts"
          exit 1

      - name: Full test suite
        run: zig build test --summary all

      # The self-healing arc, gated nightly end to end: abrupt server
      # deaths every 2s, half the workers running persistent
      # WarmRedialClients. The soak's own gates enforce: every death
      # produced reset-certified closes AND every healing client healed
      # across every death (min_rebinds), zero give-ups.
      - name: QUIC self-healing soak (abrupt deaths + healing workers)
        run: zig build -Dquic=true -Doptimize=ReleaseSafe soak -- --transport quic --abrupt-death-every-ms 2000 --seconds 20 --workers 16 --heal-workers 8

      - name: ReleaseSafe hardening tests
        run: zig build test-release-safe --summary all

      - name: QUIC transport tests
        run: zig build -Dquic=true test-rpc-quic --summary all
