name: Nightly

on:
  schedule:
    # 09:17 UTC daily — off the top-of-hour rush.
    - cron: "17 9 * * *"
  workflow_dispatch:

# Failure names. `just release-tag` runs `just check-nightly-gate`, which
# needs 3 Nightly runs on the release commit that are green or that fail only
# on rows of .github/known-flakes.txt (RELEASING.md step 5). To match a row,
# the gate reads the nightly-failure annotations of each failed job. So each
# step that can fail has an `id`. Most of them run in bash (`-eo pipefail`,
# so the tee keeps the exit code) and copy their output to
# $RUNNER_TEMP/<id>.log ($GITHUB_ACTION is the step id). The final
# `if: failure()` step of each job reads those logs with tools/ci_gates.ts and
# writes one annotation per failed test (`error: '<test>' failed`) and per
# `soak: FAIL` line, or `step:<id>` for a failed step with neither line or
# with no log.

jobs:
  soak:
    name: RPC soak (chaos + deadlines, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Proves the log wiring that the final step depends on (the step id in
      # $GITHUB_ACTION, the tee into $RUNNER_TEMP, Deno reading the log) on
      # Linux and Windows, on green runs too. It writes no annotation.
      - name: Check the failure-name wiring
        id: log_wiring
        shell: bash
        run: |
          echo "error: 'ci_gates.wiring' failed:" | tee "$RUNNER_TEMP/$GITHUB_ACTION.log" > /dev/null
          NIGHTLY_STEPS='{"log_wiring":{"outcome":"failure","conclusion":"failure"}}' \
            deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP" --expect ci_gates.wiring

      # --rss-gate report: the process-RSS trend check prints its verdict
      # (plus a ::warning:: annotation when it would fail) but never fails
      # the lane. It lands report-only until RSS baselines exist; switch a
      # lane to `--rss-gate enforce` to gate on it.
      - name: Run soak harness (2 minutes, 8 workers)
        id: soak_8w
        shell: bash
        run: zig build soak -- --seconds 120 --workers 8 --rss-gate report 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      - name: Run soak harness under ReleaseSafe (1 minute)
        id: soak_8w_releasesafe
        shell: bash
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds 60 --workers 8 --rss-gate report 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # 64 workers, not 8: the accept-churn abort class (setTcpNoDelay
      # dying through std.posix.setsockopt's `unreachable` errno arms when
      # a peer resets the socket between accept() and the option call,
      # fixed in 8386468) reproduced 6/6 locally at >=32 workers and never
      # at 8 — worker count is the trigger, so the low-count lanes above
      # cannot see this class. ReleaseSafe: locally the abort surfaced
      # only under optimized timing (0/2 in Debug at the same load).
      #
      # Linux only here. Windows runs this lane in its own job
      # (soak-windows-64w below), on a fresh runner with a wider port range.
      - name: Run soak harness under ReleaseSafe (64 workers)
        if: runner.os == 'Linux'
        id: soak_64w
        shell: bash
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds 60 --workers 64 --rss-gate report 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # Linux-only: the TSan lane is validated on Linux only (libtsan used to
      # segfault at startup on darwin), and Windows has no zig TSan runtime;
      # build.zig hard-fails the step on
      # unsupported hosts rather than passing vacuously. 30 seconds is enough
      # for the worker/connection churn to cross-schedule under TSan's ~5-15x
      # slowdown.
      - name: Run soak harness under ThreadSanitizer (30 seconds)
        if: runner.os == 'Linux'
        id: soak_tsan
        shell: bash
        run: zig build soak-tsan -- --seconds 30 --workers 8 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"

  # The Windows 64-worker soak lane (see the 64-worker step above for why 64
  # workers and ReleaseSafe). It has its own job so that it starts on a fresh
  # runner with its own port budget.
  #
  # Port budget. Windows holds a closed TCP port in TIME_WAIT for 120 s, and
  # its default dynamic port range has 16,384 ports. When this lane ran after
  # the two 8-worker lanes in the soak job, it started with about 16k of
  # their ports in TIME_WAIT. 8 of 17 Windows Nightlies from 10-04 to 10-15
  # reported port exhaustion on it. Nightly 38377271133 (10-13) was exhausted
  # from +0.6 s (36,927 dials failed, 483 succeeded first). So this job widens
  # the dynamic range to 55,535 ports (10000-65534). Then it prints the range
  # and the TIME_WAIT count just before the lane starts.
  #
  # Windows runs 20 s, not 60 s. The first run of this lane (33029339794)
  # caught a teardown abort: closing the listener under a parked accept
  # completes that accept with STATUS_CANCELLED, which std's
  # netAcceptWindows treats as unreachable. WorkerPool.stopAccepting now
  # wakes every parked accept with self-connect nudges before it closes the
  # listener, and it retries the nudges with no bound. On a port-exhausted
  # host no nudge can connect, so teardown waits until TIME_WAIT ports
  # expire. The Linux 64-worker lane did 458 sessions/s on 10-13 and 818 on
  # 10-11. 20 s at the higher rate uses about 16k ports, well inside the
  # widened range. Compare sessions per second with the Linux lane of the
  # same night, not session counts: its rate varies about 2x between nights.
  #
  # Dial failures are classified apart from mid-session transport errors
  # (which are bounded). The soak reports port exhaustion with a ::warning::
  # annotation. It gates unexplained dial failures, refused or timed-out
  # dials, and a Windows connect-stage error.Unexpected that does not have
  # the exhaustion shape (see tools/soak_rpc.zig). The memory gates judge
  # only the run before the exhaustion onset. If the onset comes before half
  # of the run, the verdict is not_exercised: a ::warning::, not a failure.
  soak-windows-64w:
    name: RPC soak (64 workers, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Hosted Windows runners run as an administrator, which netsh needs.
      # If netsh fails anyway, warn and run the lane on the default range.
      # continue-on-error is a backstop in case pwsh stops on the native
      # command's exit code before the warning prints.
      - name: Widen the dynamic TCP port range
        shell: pwsh
        continue-on-error: true
        run: |
          netsh int ipv4 set dynamicport tcp start=10000 num=55535
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=soak port budget::netsh could not widen the dynamic TCP port range (exit code $LASTEXITCODE). The 64-worker lane runs on the default range."
          }
          exit 0

      # Excluded port ranges (WinNAT and Hyper-V reservations) inside the
      # dynamic range make fewer ports usable than the range size says.
      - name: Show the port budget (dynamic range, exclusions, TIME_WAIT count)
        shell: pwsh
        continue-on-error: true
        run: |
          $range = netsh int ipv4 show dynamicport tcp | Out-String
          Write-Output $range.Trim()
          Write-Output (netsh int ipv4 show excludedportrange protocol=tcp | Out-String).Trim()
          $timeWait = (netstat -an -p tcp | Select-String -SimpleMatch 'TIME_WAIT' | Measure-Object).Count
          Write-Output "TCP connections in TIME_WAIT: $timeWait"
          if ($range -match 'Number of Ports\s*:\s*(\d+)') {
            $ports = [int]$Matches[1]
            if ($ports -lt 55535) {
              Write-Output "::warning title=soak port budget::The dynamic TCP port range has $ports ports, not 55535."
            }
          } else {
            Write-Output "::warning title=soak port budget::Could not read the dynamic TCP port range from netsh."
          }
          exit 0

      - name: Run soak harness under ReleaseSafe (64 workers, 20 seconds)
        id: soak_64w
        shell: bash
        run: zig build -Doptimize=ReleaseSafe soak -- --seconds 20 --workers 64 --rss-gate report 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"

  fuzz:
    name: Coverage-guided fuzzing with per-target evidence
    # arm64, not ubuntu-latest: on x86_64 the zig fuzzer's maker dies with
    # "start index 1 is larger than end index 0" right after the fuzz phase
    # starts, before any coverage-guided signal — reproduced on CI with both
    # dev.813 (run 30533131144) and dev.1252 (run 30562797754), i.e. on both
    # sides of the dev.1190 maker restructure. The same snapshot + command on
    # aarch64-linux fuzzes a full 10-minute window cleanly (probed 2026-07-30,
    # native ubuntu-24.04 container: 626s, zero infra panics, growing corpus).
    # arm runners are free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      # This lane used to pin its own Zig (dev.1252) because the repo's
      # standard toolchain was dev.813, whose fuzzer maker panics, while
      # dev.1444+ renamed std.builtin.OptimizeMode and would not compile this
      # tree. Both halves are resolved: the tree was migrated to the new
      # Optimize spelling and the whole repo now pins one version in mise.toml,
      # so this lane takes the same toolchain as everything else. If the
      # fuzzer regresses again, re-probe (600s+, cold cache, grep the log for
      # panics — not just the exit code) before reintroducing a divergent pin.
      - uses: ./.github/actions/setup-zig

      - name: Prove evidence rejects missing activity and oracle failures
        id: fuzz_evidence_selftest
        shell: bash
        run: mise exec -- zig test tools/fuzz_evidence.zig 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      - name: Fuzz each target with a measured activity floor
        id: fuzz_targets
        shell: bash
        run: mise exec -- zig run tools/fuzz_evidence.zig -- --runs=10000 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # Random operation sequences over the native C ABI (src/native/,
      # capnp-swift handoff H7). Not coverage-guided: a seeded driver that
      # exits 1 on the first violated invariant and prints the seed to
      # replay. `test-fuzz-smoke` runs it for 3 seconds on every push.
      - name: Fuzz the native C ABI (10 minutes, ReleaseSafe)
        id: fuzz_native_abi
        shell: bash
        run: mise exec -- zig build -Doptimize=ReleaseSafe fuzz-native-abi -- --seconds 600 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      - name: Preserve fuzz receipts, reports, and replay corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .zig-cache/fuzz-evidence/
            .zig-cache/f/
            .zig-cache/v/

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"

  extended-gates:
    name: Extended gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # The full suite requires the pinned WASM schema compiler. Keep the same
      # integrity/runtime gate as per-push CI; unavailable tooling must fail
      # compiler-dependent suites rather than silently remove their coverage.
      - uses: ./.github/actions/setup-capnp

      # setup-zig's built-in cache saves a fresh per-job entry every run, so
      # CI churn evicts it from the repo's 10 GB quota long before the next
      # nightly. Keep the package store in its own small entry keyed on the
      # dependency manifest — shared with ci.yml's quic-transport lane, so
      # every push to main re-warms it.
      - name: Restore Zig package cache
        uses: actions/cache@v5
        with:
          path: .zig-global-cache/p
          key: zig-packages-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      - name: Prefetch dependency tree
        id: prefetch
        # Retries transient upstream failures (boringssl.googlesource.com
        # 503s took down the 2026-07-03 nightly) so the QUIC gate below
        # only ever fails on real regressions.
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::dependency fetch attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "dependency fetch failed after 3 attempts"
          exit 1

      - name: Full test suite
        id: full_suite
        shell: bash
        run: zig build test --summary all 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # The self-healing arc, gated nightly end to end: abrupt server
      # deaths every 2s, half the workers running persistent
      # WarmRedialClients. The soak's own gates enforce: every death
      # produced reset-certified closes AND every healing client healed
      # across every death (min_rebinds), zero give-ups.
      #
      # --rss-gate enforce: on the quic v0.19.0 pin this lane's RSS climbed
      # while the Zig heap stayed flat (BoringSSL AEAD contexts leaked per
      # handshake, fixed upstream in quic 0.21.1). On the v0.24.0 pin the same
      # soak run for 10 minutes held RSS flat (steady-state -5.3%, peak
      # 172 MB over ~89,600 handshakes; macOS, 2026-10-03), so the RSS
      # verdict now gates.
      - name: QUIC self-healing soak (abrupt deaths + healing workers)
        id: quic_heal_soak
        shell: bash
        run: zig build -Dquic=true -Doptimize=ReleaseSafe soak -- --transport quic --abrupt-death-every-ms 2000 --seconds 20 --workers 16 --heal-workers 8 --rss-gate enforce 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # The same soak against the hardened preset (Retry on) with .restore_only
      # 0-RTT, where every restart loads the same session-ticket key and
      # new_token_key, as a server that persists them does. --ticket-key adds
      # the 0-RTT gate (sprint 2026-10-04 item 17): every death must be healed
      # by at least one client whose zero_rtt_generations counted that heal
      # and whose retried_generations did not (its NEW_TOKEN skipped the
      # Retry), and the restarted server must have run that restore before
      # its handshake completed. Deaths in the last second before the healers
      # stop are not judged. Across the run, every healing Retry must be a
      # first dial or a port fallback. The Retry checks exist because since
      # quic-zig v0.27.0 a heal behind a Retry still restores in 0-RTT, so
      # the 0-RTT counts alone no longer see a lost NEW_TOKEN. Proven locally
      # (ReleaseSafe, quic-zig v0.27.0; macOS and the arm64 Linux container):
      # every death healed 8/8 over 0-RTT with no Retry, the only Retries the
      # 8 first dials. Red: the --inject-ticket-key-rotation hook (no 0-RTT
      # heal), heals from a new port (no 16f: every heal retried) and a token
      # clock that restarts at zero (no 16e: over 100 unexplained Retries).
      # Same binary as the step above.
      - name: QUIC self-healing soak with a persisted ticket key (0-RTT heals)
        id: quic_ticket_key_soak
        shell: bash
        run: zig build -Dquic=true -Doptimize=ReleaseSafe soak -- --transport quic --abrupt-death-every-ms 2000 --seconds 20 --workers 16 --heal-workers 8 --ticket-key --rss-gate enforce 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      - name: ReleaseSafe hardening tests
        id: release_safe_tests
        shell: bash
        run: zig build test-release-safe --summary all 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      - name: QUIC transport tests
        id: quic_transport_tests
        shell: bash
        run: zig build -Dquic=true test-rpc-quic --summary all 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # Heads-up for the owner, never a failure: ci.yml's evented canary is
      # green only while std.Io.Evented fails to compile with the known std
      # defect. When it stops failing that way, say so on the run summary so
      # `evented_available` in src/io_backend.zig gets re-checked.
      - name: Evented canary notice
        if: ${{ !cancelled() }}
        run: |
          if zig build check-evented-canary --summary none; then
            echo "std.Io.Evented still fails to compile with the known defect; evented_available stays false."
          else
            echo "::notice title=std.Io.Evented canary changed::check-evented-canary no longer sees the expected processReplacePath error. If std.Io.Evented now compiles, flip evented_available in src/io_backend.zig and retarget build/evented_canary.zig; otherwise update its expected error and the fork handoff."
          fi

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"

  # The clean-room package preflight on all three OSes. Per-push CI runs it
  # on Linux only, because on Windows the step took 11.7 to 21.7 min of the
  # 45-min Test job (10 green CI runs, 10-11 to 10-17). The tag gate needs
  # green Nightlies on the release commit, so a release still gets the
  # preflight on all three OSes.
  package-preflight:
    name: Package preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The step took at most 21.7 min (Windows), 13.1 min (Linux) and 11.5 min
    # (macOS) in those CI runs. Setup takes a few minutes more.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # The preflight verifies the pinned WASM schema compiler, as in ci.yml.
      - uses: ./.github/actions/setup-capnp

      # The same step as ci.yml's Test job, in the same default shell (pwsh
      # on Windows). The preflight runs `tar` from PATH, and Git Bash puts
      # its own tar first on PATH, so this step does not move to bash for a
      # tee. A failure here is named step:package_preflight.
      - name: Clean-room filtered-package consumers
        id: package_preflight
        run: zig build package-preflight --summary all

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"

  # The QUIC twin of ci.yml's bench-check, which is TCP-only. Before this job
  # bench-check-quic ran in no workflow at all. Its own job, so a regression
  # reads as a benchmark failure rather than a red extended-gates. The
  # allocation cases gate; the wall-clock cases are advisory until they are
  # baselined from these runs (see the note in bench/baselines-quic.json).
  bench-quic:
    name: QUIC benchmark regression check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Restore Zig package cache
        uses: actions/cache@v5
        with:
          path: .zig-global-cache/p
          key: zig-packages-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      - name: Prefetch dependency tree
        id: prefetch
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::dependency fetch attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "dependency fetch failed after 3 attempts"
          exit 1

      - name: Run QUIC benchmark regression checks
        id: bench_quic
        shell: bash
        run: zig build -Dquic=true -Doptimize=ReleaseFast bench-check-quic 2>&1 | tee "$RUNNER_TEMP/$GITHUB_ACTION.log"

      # The tag gate reads these annotations. See "Failure names" at the top
      # of this file.
      - name: Name the failures for the tag gate
        if: failure()
        shell: bash
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        run: deno run --allow-read --allow-env --no-config tools/ci_gates.ts annotate --log-dir "$RUNNER_TEMP"
