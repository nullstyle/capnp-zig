name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rapid pushes to a branch (or PR) supersede in-flight runs: cancel the older
# run so the multi-platform matrix does not pile up and starve runners.
#
# KNOWN FAILURE MODE (2026-07-30): a run cancelled here can still execute
# setup-zig's post step and save a PARTIAL `.zig-cache`. Because restores are
# prefix-matched, the next run inherits it, and Zig then hits a manifest that
# claims a cached artifact which is not in the tarball:
#     error: lld-link: could not open '.zig-cache\o\<hash>\compiler_rt.lib'
# Worse, that run saves its own poisoned cache, so the failure self-perpetuates
# across re-runs and later pushes — a re-run alone never clears it.
# REMEDY: delete the entries and let the next run rebuild clean, e.g.
#     gh cache list --json id,key | ... | gh cache delete <id>
# (Windows hit this first because it links compiler_rt.lib explicitly; nothing
# in the repo's own code was involved.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reflection-conformance:
    name: Reflection and generated RPC conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/setup-capnp
      - name: Build the pinned C++ reference
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 g++-14 ninja-build pkg-config
          # GCC 13 lacks <print>; GCC 14.2 hits the reference's known optimizer
          # bug. Use Clang with GCC 14's C++23 library and probe that exact pair.
          printf '#include <print>\nint main() { std::println("C++23 ready"); }\n' > "$RUNNER_TEMP/capnp-cxx23.cpp"
          "$CXX" -std=c++23 "$RUNNER_TEMP/capnp-cxx23.cpp" -o "$RUNNER_TEMP/capnp-cxx23"
          "$RUNNER_TEMP/capnp-cxx23"
          cmake -S vendor/ext/capnproto -B .zig-cache/reference-cpp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DWITH_OPENSSL=OFF \
            -DCAPNP_LITE=OFF -DEXTERNAL_CAPNP=OFF \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/capnp-reference"
          cmake --build .zig-cache/reference-cpp --parallel 4
          cmake --install .zig-cache/reference-cpp
      - name: Native, WASI, and independent C++ checks
        shell: bash
        run: |
          # Only the C++ oracle step selects native capnp/capnpc-c++ and their
          # matching headers/libraries. Zig request production uses the explicit
          # WASM driver even when the native compiler is available on PATH.
          export PATH="$RUNNER_TEMP/capnp-reference/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/capnp-reference/lib/pkgconfig"
          unset PKG_CONFIG_PATH
          test "$(command -v capnp)" = "$RUNNER_TEMP/capnp-reference/bin/capnp"
          test "$(command -v capnpc-c++)" = "$RUNNER_TEMP/capnp-reference/bin/capnpc-c++"
          test "$(pkg-config --variable=prefix capnp)" = "$RUNNER_TEMP/capnp-reference"
          test "$(capnp --version)" = "Cap'n Proto version $(pkg-config --modversion capnp)"
          mise exec -- zig build test-reflection test-reflection-wasi test-reflection-cpp --summary all -j4
          mise exec -- zig build -Doptimize=ReleaseSafe test-reflection test-reflection-wasi test-reflection-cpp --summary all -j4
          mise exec -- zig build test-reflection-oracle-ablation test-codegen-streaming-cpp test-codegen-generic-rpc-cpp --summary all -j2
      - name: Fd passing against the C++ reference
        # Sprint item 15: the reference's "send FD over RPC" and "FD per
        # message limit" tests, C++ <-> Zig over an AF_UNIX socketpair, in
        # both directions. Built against the pinned reference above.
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/capnp-reference/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/capnp-reference/lib/pkgconfig"
          unset PKG_CONFIG_PATH
          test "$(command -v capnp)" = "$RUNNER_TEMP/capnp-reference/bin/capnp"
          test "$(pkg-config --variable=prefix capnp)" = "$RUNNER_TEMP/capnp-reference"
          mise exec -- zig build test-rpc-fd-cpp --summary all

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test binary must fail the job, not burn a runner for the
    # 6-hour default. Sized against measured runs rather than a guess: on
    # 2026-08-12 the legs took 14m40s (macOS), ~20m (Windows) and 20m50s
    # (ubuntu) — the last one blowing a 20-minute step cap and failing a run
    # in which every test passed. The suite grew over the risk-surface sprint
    # (cross-thread stress reps, structural fuzz targets), so the caps now
    # bound a hang with headroom instead of clipping a healthy run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Compiler-dependent serialization/codegen suites require the verified
      # WASM compiler; missing tooling is a failure, never skipped coverage.
      # Share artifact/runtime verification with the other full-suite jobs.
      # tests/hardening/toolchain_gate_test.zig covers committed fixtures but
      # cannot read the environment to check the tool.
      - uses: ./.github/actions/setup-capnp

      - name: Portable compiler driver integrity and execution tests
        # Uses the real WASM compiler and a fixture plugin process on every OS,
        # including Windows binary streams and workspace/output paths with spaces.
        # The package preflight below exercises the package-built Zig generator.
        # Missing artifacts or Wasmtime fail these tests rather than skip them.
        run: deno test --allow-all --no-config tools/capnp_tool_test.ts

      - name: Verify test command execution and failure propagation
        shell: bash
        run: bash tools/check-stall-watchdog.sh

      - name: Windows timed-read regressions (Debug, 90s run limit)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-windows-timed-read.ps1 -Optimize Debug

      - name: Upload Windows timed-read evidence (Debug)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-timed-read-Debug-${{ github.run_id }}
          path: |
            .zig-cache/ci/windows-timed-read/Debug/*.log
            .zig-cache/ci/windows-timed-read/Debug/receipt.json

      # The pinned Windows spawn backend can leak a runner's output pipe into
      # a concurrent compiler or test process. Warm the exact compile graph in
      # parallel, let that invocation exit, then serialize test execution.
      # See docs/windows-test-runner.md for the actual Maker A/B evidence.
      - name: Compile Windows test binaries
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/stall_watchdog.sh zig build test-compile --summary all

      - name: Run tests
        # See the job timeout above. Wrapped in the stall watchdog so a hang
        # captures native process evidence (including Linux stacks) in this log
        # before the cap kills the step, instead of dying anonymously.
        timeout-minutes: 35
        # PowerShell can open .sh via a Windows file association and report
        # success before the child has run. Execute and wait in Bash explicitly.
        shell: bash
        run: bash tools/stall_watchdog.sh zig build test --summary all ${{ runner.os == 'Windows' && '-j1' || '' }}

      - name: Check compilation
        run: zig build check

      - name: API snapshot check
        # On every OS: the snapshot is target-stable by construction and
        # this is the gate that keeps it that way.
        run: zig build check-api --summary all

      - name: Stable-surface closure check
        # A frozen entry point whose signature mentions an Experimental type is
        # only nominally frozen. This fails when one does.
        run: zig build api-closure --summary all

      - name: Vendor RPC schema sync (check-rpc)
        if: runner.os == 'Linux'
        run: just src/rpc/check-rpc

      - name: Generated-artifact drift check
        # Linux owns the complete golden refresh; portable driver generation
        # and package-plugin acceptance run on every OS. Regenerates committed
        # generated file + the API snapshot and fails if any drifted — the
        # class of bug that turned this workflow red mid-sprint more than once.
        if: runner.os == 'Linux'
        run: just check-generated

      - name: Clean-room filtered-package consumers
        # Runs default, core, and opt-in QUIC consumers from a manifest-filtered
        # archive in both Debug and ReleaseSafe. The tool confines all writes to
        # temporary caches and asserts the checkout stays unchanged.
        run: zig build package-preflight --summary all

      - name: Soak smoke (2s, loopback TCP)
        run: zig build soak -- --seconds 2

      - name: Self-interop e2e (zig client vs zig server, loopback)
        run: zig build e2e-self --summary all

      - name: Self-interop e2e over a Unix-domain socket (zig client vs zig server)
        # rpc.transport.unix is Linux and macOS only; the tool fails (not
        # skips) on any other target, so the step is gated here instead.
        if: runner.os != 'Windows'
        run: zig build e2e-self-unix --summary all

      - name: Experimental L4 Join lease/recovery e2e (Zig, loopback)
        run: zig build e2e-l4-zig --summary all

      - name: RPC ping-pong example (guards the connection teardown seam)
        run: zig build example-rpc

      - name: RPC ping-pong example over a Unix-domain socket
        if: runner.os != 'Windows'
        run: zig build example-rpc-unix

      - name: Fd-passing example over a Unix-domain socket
        # Fails unless the fd arrives, works, and every copy of it is closed
        # at the end (docs/rpc-unix-sockets.md).
        if: runner.os != 'Windows'
        run: zig build example-rpc-fd

  wasm-generator-drift:
    name: Released Wasm generator drift (non-gating)
    # A drift signal, not a gate: the capnpc-zig.wasm that the pinned capnpc-wasm
    # release ships (tools/capnpc-wasm-generator.json) runs on every committed
    # CodeGeneratorRequest, and its files are compared with this checkout's
    # plugin. A difference means a generator change that no capnpc-wasm release
    # carries yet, which needs a capnpc-wasm release, not a fix here.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Compare the released capnpc-zig.wasm with this checkout's plugin
        run: mise exec -- just check-wasm-generator

  fmt-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Check formatting
        run: just fmt-check

  evented-check:
    name: Evented backend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # This job used to run `zig build -Dio-backend=evented check`, which
      # verified nothing that plain `zig build check` did not already.
      # `-Dio-backend` is a `[]const u8` compared at RUNTIME by
      # `io_backend.parseKind`, so all three arms of `Backend.init` are
      # semantically analysed in EVERY configuration. Proven by ablation:
      # breaking the `.evented` arm turns plain `zig build check` red with no
      # flag passed at all.
      #
      # What was missing was any lane that EXECUTES a selector. `.threaded` is
      # the one that can actually carry RPC today — `std.Io.Evented` has no
      # working socket vtable upstream at the pinned toolchain (see
      # docs/stability.md), so an evented execution lane is not yet possible.
      # Ablation for this one: making `parseKind("threaded")` return null leaves
      # the old compile check green and turns this lane red.
      - name: Execute the RPC e2e over the threaded Io selector
        run: zig build -Dio-backend=threaded e2e-self --summary all

      # Expected-fail canary. This step used to run
      # `zig build -Dio-backend=evented check`, which compiled nothing evented:
      # src/io_backend.zig has `evented_available = false` because no
      # std.Io.Evented compiles at Zig 0.17.0 (Uring and Dispatch set the
      # dropped `Io.VTable.processReplacePath`). The canary compiles a file that
      # references std.Io.Evented and is green ONLY while that compile fails
      # with the known error. Red means std changed: if Evented now compiles,
      # flip `evented_available` and retarget the canary (build/evented_canary.zig);
      # if it fails differently, update the expected error and the fork handoff
      # (docs/upstream/handoff-zig-fork-evented-processreplacepath.md).
      # Ablation: setting `expect_errors = null` in build/evented_canary.zig, or
      # building against a std patched per that handoff, turns it red.
      - name: Evented canary (expected compile failure)
        run: zig build check-evented-canary --summary all

  quic-transport:
    name: QUIC targeted transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Slowest healthy run measured across the matrix: 11m (windows). A hung
    # test binary otherwise burns the 6-hour default before anyone sees it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - uses: ./.github/actions/setup-capnp

      # Package store cached separately from setup-zig's per-run cache; the
      # key is shared with nightly.yml's extended-gates job so nightly QUIC
      # runs inherit a warm cache from per-push CI.
      - name: Restore Zig package cache
        uses: actions/cache@v5
        with:
          path: .zig-global-cache/p
          key: zig-packages-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      - name: Prefetch dependency tree
        # Retries transient upstream failures (googlesource.com 503s) so the
        # QUIC lane only fails on real regressions.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::dependency fetch attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "dependency fetch failed after 3 attempts"
          exit 1

      # This is the platform gate: all four real QUIC test binaries must
      # execute natively, in both Debug and ReleaseSafe, with a source inventory
      # floor and an explicit ban on SkipZigTest. A compile-only package
      # consumer is not transport evidence.
      - name: Compile Windows QUIC evidence binaries (Debug)
        if: runner.os == 'Windows'
        run: zig build -Dquic=true -Doptimize=Debug test-rpc-quic-evidence-compile --summary all

      - name: Run native QUIC transport evidence (Debug, no skips)
        # The stall watchdog records which test binary is stuck (and its
        # threads) if the step goes quiet; it never stops the command. A
        # Windows ReleaseSafe run hung once on 2026-10-05 (run 37248467342,
        # attempt 1) and passed on rerun, with no evidence of where.
        shell: bash
        run: bash tools/stall_watchdog.sh zig build -Dquic=true -Doptimize=Debug test-rpc-quic-evidence --summary all ${{ runner.os == 'Windows' && '-j1' || '' }}

      - name: Compile Windows QUIC evidence binaries (ReleaseSafe)
        if: runner.os == 'Windows'
        run: zig build -Dquic=true -Doptimize=ReleaseSafe test-rpc-quic-evidence-compile --summary all

      - name: Run native QUIC transport evidence (ReleaseSafe, no skips)
        # The stall watchdog records which test binary is stuck (and its
        # threads) if the step goes quiet; it never stops the command. A
        # Windows ReleaseSafe run hung once on 2026-10-05 (run 37248467342,
        # attempt 1) and passed on rerun, with no evidence of where.
        shell: bash
        run: bash tools/stall_watchdog.sh zig build -Dquic=true -Doptimize=ReleaseSafe test-rpc-quic-evidence --summary all ${{ runner.os == 'Windows' && '-j1' || '' }}

      # One real ping-pong round trip through the API docs/quic-transport.md
      # teaches (`quic.serve` + `quic.connect`); the example exits non-zero on
      # a wrong or missing reply.
      - name: Run the QUIC RPC example (one round trip)
        run: zig build -Dquic=true example-rpc-quic --summary all

      # The remaining steps validate the complete QUIC package root, rather
      # than the focused transport. Keep them on Linux to avoid tripling the
      # expensive full-tree gate now that transport execution itself is
      # cross-platform.
      - name: Build QUIC-enabled targets
        if: runner.os == 'Linux'
        run: zig build -Dquic=true --summary all

      - name: Check QUIC-enabled build graph
        if: runner.os == 'Linux'
        run: zig build -Dquic=true check --summary all

      # The FULL suite under -Dquic=true, because `-Dquic` swaps the library
      # ROOT (src/lib_quic.zig) and the targeted lanes above never compile the
      # non-QUIC suites against it. That gap hid a missing `canonical` export
      # on the QUIC root through an entire release: `zig build test` uses
      # src/lib.zig, `test-rpc-quic` only touches the transport suites, and
      # nothing in between ever built e.g. the serialization tests against the
      # root a QUIC consumer actually gets.
      - name: Run the full suite against the QUIC library root
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/stall_watchdog.sh zig build -Dquic=true test --summary all

      # The default `check-api` job runs WITHOUT -Dquic=true, so it sees
      # `rpc.transport.quic` as the disabled stub and the real ServerOptions
      # fields not at all — quic-zig v0.10.0's breaking Config rename moved
      # ZERO snapshot lines. This checks the QUIC-enabled surface with
      # --strict-experimental, gating BOTH invariants: enabling an
      # Experimental transport must leave docs/api-snapshot.txt (the FROZEN
      # contract) byte-identical, and the committed
      # docs/api-snapshot-experimental-quic.txt must match the tree.
      #
      # The staleness half used to be impossible: `std.Thread.Id` is u64 on
      # macOS and u32 on Linux, so the stored thread-id fields rendered
      # differently depending on where the tool ran. Those fields are now
      # widened to u64 at the source, which makes the experimental files
      # platform-stable between Linux and macOS. Linux-only because Windows
      # renders genuinely differ (`win_read` bridge, socket handle types).
      #
      # PIN-BUMP TRAP (found on the quic v0.14.0 bump): regenerate AND
      # check the snapshot against a FRESH module graph after bumping a
      # dependency. A stale local cache/zig-pkg mapping can leave the
      # api-snapshot tool rendering the OLD pin's type names (v0.12's
      # `conn.state.Connection` vs v0.14's `Connection`) while the test
      # binaries already build the new pin — and the stale render
      # happily verifies against its own stale file, so the drift only
      # surfaces on CI's clean checkout. The renders themselves are
      # Linux/macOS-identical (verified byte-for-byte on the v0.14
      # surface); when local and CI disagree, suspect the local cache,
      # not the platform.
      - name: QUIC-enabled API snapshot (strict, incl. experimental staleness)
        if: runner.os == 'Linux'
        run: zig build -Dquic=true check-api-experimental-quic

      - name: Compile QUIC documentation snippet fixtures
        if: runner.os == 'Linux'
        run: zig build -Dquic=true test-docs-snippets-quic --summary all

  docs-smoke:
    name: Docs smoke and snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Compile documentation snippet fixtures
        run: zig build test-docs-snippets --summary all

      - name: Run documentation/examples smoke gate
        run: zig build docs-smoke --summary all

      - name: Build and test the KVStore service with current generated readers
        run: |
          zig build --build-file examples/kvstore/build.zig -Doptimize=ReleaseSafe --summary all
          zig build --build-file examples/kvstore/build.zig test -Doptimize=ReleaseSafe --summary all

      # Strict mode also fails when the committed experimental snapshot is
      # stale (possible since stored thread ids were widened to u64, making
      # the rendered surface platform-stable between Linux and macOS).
      - name: Check public API snapshot (strict, incl. experimental staleness)
        run: zig build check-api-experimental --summary all

  cross-targets:
    name: Cross-target compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-gnu
          - x86-linux-gnu # 32-bit
          - powerpc64-linux-gnu # big-endian
          - x86_64-windows # catches Windows rot without a Windows runner
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Compile-only check for ${{ matrix.target }}
        run: zig build check-compile -Dtarget=${{ matrix.target }} --summary all

      - name: Compile test suite for ${{ matrix.target }}
        # All four targets. This was pinned to x86_64-windows because the
        # step could not pass anywhere else -- the TSan-instrumented suites
        # were registered into check-test-compile, and TSan supports only a
        # few architectures, so other targets died on
        # "TSANUnsupportedCPUArchitecture" (and powerpc64 on the libc that
        # TSan module pulled in). Those artifacts now belong to `check-tsan`
        # alone, which is where TSan compile coverage was always meant to
        # live, and all four targets compile the suite.
        #
        # The narrow pinning was not free: it hid a 32-bit test break from
        # 2026-07-29 (two `0xDEADBEEF00000000 + i` literals evaluated as
        # usize) until this step was widened.
        run: zig build check-test-compile -Dtarget=${{ matrix.target }} --summary all

      - name: Compile with -Dquic=true for ${{ matrix.target }}
        # 32-bit only: it is where QUIC code and tests broke unseen (64-bit
        # atomics in the soak tool and the QUIC loop-thread tests, a usize
        # literal past u32) while every -Dquic job ran on 64-bit hosts.
        if: matrix.target == 'x86-linux-gnu'
        run: zig build -Dquic=true check-compile check-test-compile -Dtarget=${{ matrix.target }} --summary all

  ios-check:
    name: iOS cross-compile (static libraries, no SDK)
    # ubuntu-latest: the cheapest runner this workflow already uses. A static
    # library never links, so it needs no Apple SDK and no macOS runner, and
    # running on Linux proves that on every push. `check-ios` compiles
    # capnpc-zig-core for aarch64-ios, aarch64-ios-simulator and
    # x86_64-ios-simulator (fd passing on, so the target gate alone must
    # compile it out) and for aarch64-macos with -Dfd-passing=false, each in
    # Debug and ReleaseSafe, plus the full module's TCP transport for
    # aarch64-ios and aarch64-maccatalyst (its AF_UNIX refusal path, which no
    # lane runs). Nothing reads the vendored submodules.
    # Ablation: putting `isDarwin()` back in `fd_passing.target_supported`
    # turns the six iOS libraries red with std's `Threaded.zig:15486` error.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Compile capnpc-zig-core for iOS, both simulators, and macOS with fd passing off
        run: zig build check-ios --summary all

  fd-passing-off:
    name: Fd passing compiled out (${{ matrix.os }})
    # The whole suite again with -Dfd-passing=false: no fd passing, no fd
    # closer threads, no fd budget, no AF_UNIX transport. Linux and macOS
    # only, because the option changes nothing on Windows (no fd passing
    # either way). Sized like the Test job, whose legs it mirrors.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Compiler-dependent suites need the verified WASM compiler, as in the
      # Test job.
      - uses: ./.github/actions/setup-capnp

      - name: Embedder symbol gate (macOS core static library, fd passing off)
        # The library an embedder such as capnp-swift links must import no
        # ___ulock_*, _pthread_create or _getrlimit and define no fd closer
        # function. The step reads the Mach-O archive with nm, so it runs on
        # the macOS leg (elsewhere it prints SKIPPED and succeeds).
        # Ablation: building that library with fd passing on turns it red.
        if: runner.os == 'macOS'
        run: zig build check-fd-passing-off-symbols --summary all

      - name: Run tests with fd passing compiled out
        # Wrapped in the stall watchdog like the Test job's suite.
        timeout-minutes: 35
        shell: bash
        run: bash tools/stall_watchdog.sh zig build -Dfd-passing=false test --summary all

  hardening:
    name: Hardening gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Slowest healthy run measured across the matrix: 4m (windows), before
    # the generated-shape gate joined it (21 s cold on an M-series Mac;
    # re-measure the Windows leg on its first run).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          # test-oom / test-resource-budgets pull in the schema-fidelity and
          # codegen roots, which read the vendored capnp/test corpus.
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - uses: ./.github/actions/setup-capnp

      - name: Run hardening gate
        run: zig build hardening

      - name: Generated-shape gate (frozen generated code)
        # docs/generated-shape.txt freezes the shape of the code the plugin
        # generates for a committed corpus of schemas (the Stable families
        # in docs/generated-api.md); docs/generated-shape-experimental.txt
        # must be current.
        # It runs the host plugin on committed requests, so no schema
        # compiler is needed. All three OSes: a render that differs on one
        # of them is a gate bug to fix (platform_type_aliases), not a skip.
        # It lives here, not in the Test job, because Windows Test has the
        # least headroom.
        run: zig build check-generated-shape --summary all

      - name: Run deterministic fuzz/smoke tests
        run: zig build test-fuzz-smoke --summary all

      - name: Run coverage-guided fuzz targets (deterministic mode)
        run: zig build test-fuzz --summary all

      - name: Run resource-budget regression tests
        run: zig build test-resource-budgets --summary all

      - name: Run OOM regression tests
        run: zig build test-oom --summary all

      - name: Run fd-passing limit and fault-injection tests
        # Sprint item 13: the process fd budget, N connections at their
        # per-connection fd cap with accept still working, OOM at every
        # allocation of the fd paths (the fd-passing merge needs it green),
        # EMFILE, and Linux ETOOMANYREFS (the runner is not root). The suite
        # is also part of test-oom and test-resource-budgets, so this step is
        # usually a cache hit; it names the gate. Windows compiles it and
        # skips.
        run: zig build test-rpc-unix-fd-limits --summary all

      - name: Run raw-frame security e2e tests
        run: zig build test-e2e-security --summary all

  tsan:
    name: ThreadSanitizer lane
    runs-on: ubuntu-latest
    # ThreadSanitizer instrumentation is 5-20x slower than a normal build, and
    # nothing caches .zig-cache across runs (deliberately — see setup-zig), so
    # every run recompiles the lib module and six suites instrumented from
    # scratch. The original 20 minutes was too tight: the lane was killed at
    # exactly 20m on every run since it was added and therefore never once
    # reported a result. Raised to bound a slow-but-real lane rather than a
    # gate that always dies before it can fail.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Races are optimize-mode-independent, so the lane runs Debug for the
      # best stacks. Linux-only, where the lane is validated: libtsan used to
      # segfault at startup on darwin (build.zig's tsan block documents the
      # probes), and build.zig hard-fails the step elsewhere rather than
      # letting it pass vacuously. Instrumented modules link libc so
      # std.Thread goes through pthreads, which TSan can intercept.
      - name: Run threaded suites under ThreadSanitizer
        # This lane hung for its entire existence before the wake-drain fix and
        # reported nothing. Watchdogged so a recurrence names itself.
        shell: bash
        run: bash tools/stall_watchdog.sh zig build test-tsan --summary all

  e2e-zig:
    name: Zig e2e interop
    runs-on: ubuntu-latest
    # Slowest healthy run measured: 7m. Higher headroom than the ratio used
    # elsewhere because this lane drives Docker.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      # Zig hooks use checked-in bindings. Each external backend Dockerfile
      # installs its own compiler/runtime together; no host native compiler is
      # needed or allowed to stand in for that independent implementation.

      - name: Run Zig e2e gate
        run: just e2e-zig

      # Zig <-> C++ over AF_UNIX sockets, both directions. Both peers run
      # inside the cpp-rpc container: the runner cross-builds the Zig server
      # and client for the image's architecture (x86_64-linux-musl here) and
      # mounts them; the container has no network but loopback. It reuses the
      # image the gate above just built. Go, Python and Rust record SKIP
      # (their reference harness is TCP-only); a lane that cannot connect
      # reads FAIL, never SKIP.
      - name: Zig e2e interop over Unix-domain sockets (C++ reference)
        run: just e2e-unix

      # The cross-implementation Level-3 HOSTING proof: the vendored Cap'n Proto
      # C++ reference drives the recipient and introducer roles over real TCP
      # against a capnp-zig two-peer VatC host.
      #
      # It is folded into this job rather than given its own because this job
      # already pays for docker and the cpp-rpc image, so the marginal cost is
      # near zero. Before this step existed, the lane ran in NO workflow and in
      # neither `just ci` nor `release-preflight` -- v0.6.0 shipped citing it as
      # the evidence for cross-impl hosting while nothing executed it. It is
      # also the only gate that would catch a vendored-submodule bump breaking
      # conformance.
      - name: Cross-impl L3 hosting gate (C++ drives A+B vs a Zig VatC host)
        run: just e2e-l3-vatc

  bench-check:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Run benchmark regression checks
        run: zig build -Doptimize=ReleaseFast bench-check

  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Build WASM host
        run: zig build wasm-host

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

  release-safe-tests:
    name: ReleaseSafe hardening tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Slowest healthy run measured across the matrix: 41m (windows, 2026-10-06,
    # run 37513039981; its ReleaseSafe compile alone takes 29-33m). The H1
    # tests pushed one healthy windows run past 45m (run 37530284324, the
    # compile step 32.9m), so 60.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.17

      - uses: ./.github/actions/setup-zig

      - uses: ./.github/actions/setup-capnp

      # Run every registered test binary with safety checks enabled in an
      # optimized build. This includes the L3 VatC hardening regressions on all
      # three native CI platforms; the smaller `test-release-safe` step remains
      # only a fast local/preflight subset.
      - name: Verify test command execution and failure propagation
        shell: bash
        run: bash tools/check-stall-watchdog.sh

      - name: Windows timed-read regressions (ReleaseSafe, 90s run limit)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-windows-timed-read.ps1 -Optimize ReleaseSafe

      - name: Upload Windows timed-read evidence (ReleaseSafe)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-timed-read-ReleaseSafe-${{ github.run_id }}
          path: |
            .zig-cache/ci/windows-timed-read/ReleaseSafe/*.log
            .zig-cache/ci/windows-timed-read/ReleaseSafe/receipt.json

      - name: Compile Windows test binaries (ReleaseSafe)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/stall_watchdog.sh zig build test-compile -Doptimize=ReleaseSafe --summary all

      - name: Run the full suite under ReleaseSafe
        shell: bash
        run: bash tools/stall_watchdog.sh zig build test -Doptimize=ReleaseSafe --summary all ${{ runner.os == 'Windows' && '-j1' || '' }}

      # ReleaseFast, not for speed but because it is the only mode that does NOT
      # poison a freed pointer. A use-after-free reached from a destructor is
      # invisible in Debug and ReleaseSafe -- `HostPeer.deinit` freed the queue
      # that `Peer.deinit`'s own Finish/Release sends appended to, and all 981
      # tests passed anyway until this lane existed.
      - name: Compile Windows teardown-heavy RPC binaries
        if: runner.os == 'Windows'
        run: zig build test-release-fast-compile --summary all

      - name: Run teardown-heavy RPC suites under ReleaseFast
        run: zig build test-release-fast --summary all ${{ runner.os == 'Windows' && '-j1' || '' }}
