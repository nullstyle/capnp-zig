name: Setup Zig (mise)
description: >
  Point Zig's caches at the workspace and assert that the toolchain on PATH is
  the one `mise.toml` pins.

  There is deliberately no `version` input: `mise.toml` is the single Zig
  version specifier for this repo, and `jdx/mise-action` has already installed
  from it by the time this runs. A version input here would be a second place
  to forget.

  Replaces mlugg/setup-zig@v2, which was a Node 20 action (deprecated,
  force-run on Node 24) and whose cross-run .zig-cache save/restore poisoned CI
  when a cancelled run captured that cache mid-build. A composite action has no
  Node runtime to deprecate, and nothing here caches .zig-cache across runs, so
  that failure class is structurally gone.

  NOTE: `jdx/mise-action` must pin its `version:`. mise only resolves explicit
  Zig dev-build tarball URLs (`mise ls-remote zig` lists tagged releases only)
  in recent versions, and mise-action's cache otherwise serves whatever mise a
  runner happened to cache earlier — which silently differed per platform and
  failed on Linux/Windows while passing on macOS.

runs:
  using: composite
  steps:
    # mlugg/setup-zig pointed BOTH Zig cache dirs at the workspace. Keep that:
    # `zig build --fetch=all` writes packages into the GLOBAL cache, and the
    # `actions/cache` step that caches `.zig-cache/p` only sees them because of
    # this. Dropping it would silently empty that cache rather than fail loudly.
    - name: Point Zig caches at the workspace
      shell: bash
      run: |
        echo "ZIG_GLOBAL_CACHE_DIR=${GITHUB_WORKSPACE}/.zig-cache" >> "$GITHUB_ENV"
        echo "ZIG_LOCAL_CACHE_DIR=${GITHUB_WORKSPACE}/.zig-cache" >> "$GITHUB_ENV"

    # Compare PATH against the repo pin rather than against a copy of it, so
    # this stays an assertion and never becomes a second specifier. Fails here
    # instead of twenty minutes later as a confusing compile error.
    - name: Verify PATH Zig matches the mise.toml pin
      shell: bash
      run: |
        want="$(mise current zig)"
        have="$(zig version)"
        echo "mise.toml pins: ${want}"
        echo "PATH provides:  ${have}"
        if [ -z "${want}" ]; then
          echo "::error::mise.toml pins no zig version ('mise current zig' returned empty)"
          exit 1
        fi
        if [ "${want}" != "${have}" ]; then
          echo "::error::mise.toml pins ${want} but PATH resolves ${have}"
          exit 1
        fi
