name: Install the pinned Cap'n Proto compiler
description: >
  Build the checksum-pinned compiler from tools/capnp-toolchain.json on every
  host. Lossless reflection retains compiler-provided Node metadata, so changing
  the schema compiler changes generated bytes even when field APIs are identical.
  The same bootstrap serves local mise tasks. Keep submodules recursive for the
  separately pinned standard schemas and fidelity corpus in vendor/ext.
runs:
  using: composite
  steps:
    - name: Build and install the pinned compiler
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          export CMAKE_GENERATOR='Visual Studio 18 2026'
        fi
        mise run bootstrap:capnp

    - name: Verify the selected compiler
      shell: bash
      run: mise run check:capnp
