[tools]
cmake = "3.31.8"
act = "latest"
go = "1.26.0"
just = "latest"
uv = "latest"
wasmtime = "48.0.1"

# THE single Zig version specifier for this repo: CI and local development both
# take the toolchain from here. CI's composite action verifies PATH against
# `mise current zig` rather than repeating the number, and build.zig.zon holds a
# FLOOR (minimum_zig_version), not a second pin.
#
# mise resolves explicit dev builds fine even though `mise ls-remote zig` lists
# only tagged releases. Bumping Zig is this one line (plus the floor when it
# genuinely moves).
#
# NOTE for local dev: if you manage Zig with zvm, its PATH entry wins over mise's
# shims. Either drop zvm from PATH or run `mise exec -- zig ...` to match CI.
zig = "0.17.0-dev.1683+5ceec001b"

[env]
_.path = [".zig-cache/capnp-toolchain/install/bin"]

[tasks."bootstrap:capnp"]
description = "Build the checksum-pinned Cap'n Proto schema compiler"
run = "uv run --no-project --python 3.13 tools/bootstrap_capnp.py"

[tasks."check:capnp"]
description = "Require the Cap'n Proto compiler used for committed generated artifacts"
run = "uv run --no-project --python 3.13 tools/bootstrap_capnp.py --verify"
