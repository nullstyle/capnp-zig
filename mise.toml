[tools]
cmake = "4.4.3"
act = "latest"
go = "1.26.0"
just = "latest"
uv = "latest"
# Runs tools/capnp_tool.ts and capnpc-wasm's packaged launcher (Deno 2.4.5 or newer).
deno = "2.9.6"
wasmtime = "48.0.1"

# THE single Zig version specifier for this repo: CI and local development both
# take the toolchain from here. CI's composite action verifies PATH against
# `mise current zig` rather than repeating the number, and build.zig.zon holds a
# FLOOR (minimum_zig_version), not a second pin.
#
# Pin TAGGED releases. ziglang.org deletes dev builds within weeks and the
# community mirrors follow: by 2026-10 the old dev.1683 pin was gone from
# ziglang.org and half-gone from the mirrors, which turned every CI Zig
# install into a lottery. Bumping Zig is this one line (plus the floor when
# it genuinely moves).
#
# NOTE for local dev: if you manage Zig with zvm, its PATH entry wins over mise's
# shims. Either drop zvm from PATH or run `mise exec -- zig ...` to match CI.
zig = "0.17.0"

[tasks."bootstrap:capnp"]
description = "Install the checksum-pinned Cap'n Proto WASM schema compiler"
run = "deno run --allow-all --no-config tools/capnp_tool.ts bootstrap"

[tasks."check:capnp"]
description = "Verify the pinned schema compiler artifact and Wasmtime runtime"
run = "deno run --allow-all --no-config tools/capnp_tool.ts verify"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"
